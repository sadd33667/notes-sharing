spring.application.name=sharing
# Temp DB to make app start - we switch to MySQL later
spring.datasource.url=jdbc:h2:mem:notesdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.h2.console.enabled=true
# OAuth2 (generic, trainer requirement - use any provider: Google, GitHub...)
# Fill client-id/secret from the provider console, never commit real values.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:change-me}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:change-me}
app.oauth2.redirect=http://localhost:8080/api/auth/oauth2/done
# JWT - production MUST set APP_JWT_SECRET env variable (min 32 chars).
# Dev fallback below is for training only and must be rotated before any real deploy.
app.jwt.secret=${APP_JWT_SECRET:notes-sharing-dev-secret-key-min-32-chars-long!}
app.jwt.expiration-ms=86400000
