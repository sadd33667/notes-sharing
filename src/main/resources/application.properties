spring.application.name=sharing
# Temp DB to make app start - we switch to MySQL later
spring.datasource.url=jdbc:h2:mem:notesdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.h2.console.enabled=true
# JWT (dev only - move to env variables later)
app.jwt.secret=notes-sharing-dev-secret-key-min-32-chars-long!
app.jwt.expiration-ms=86400000
